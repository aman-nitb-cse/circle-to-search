<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 285px;
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 18px;
      margin: 0;
      text-align: center;
      background: #ffffff;
      color: #202124;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #4285F4 0%, #EA4335 33%, #FBBC05 66%, #34A853 100%);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
      margin-bottom: 12px;
    }
    .header img {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 2px 6px rgba(66, 133, 244, 0.35));
    }
    .header h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      background: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 16px;
      line-height: 1.45;
    }
    .key-box {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: inset 0 0 12px rgba(66, 133, 244, 0.06);
    }
    .key-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #5f6368;
      margin-bottom: 6px;
    }
    .key-badge {
      display: inline-block;
      font-weight: 700;
      font-size: 15px;
      color: #1a73e8;
      background: #e8f0fe;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #d2e3fc;
      word-break: break-word;
    }
    .hint {
      font-size: 11px;
      color: #70757a;
      margin-top: 6px;
    }
    button {
      padding: 11px 14px;
      cursor: pointer;
      background: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853);
      background-size: 200% 200%;
      animation: googleGradient 4s ease infinite;
      color: white;
      border: none;
      border-radius: 22px;
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 3px 10px rgba(66, 133, 244, 0.35);
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    @keyframes googleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    button:hover {
      opacity: 0.95;
    }
    button.recording {
      background: #ea4335;
      animation: none;
      box-shadow: 0 2px 8px rgba(234, 67, 53, 0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon128.png" alt="Circle to Search">
    <h3>Circle to Search</h3>
  </div>
  <div class="subtitle">
    Press your shortcut (single or multi-key), draw a Google Glow circle around anything, and search Google Images instantly.
  </div>
  <div class="key-box">
    <div class="key-label">Assigned Shortcut</div>
    <span class="key-badge" id="current-key">Alt</span>
    <div class="hint" id="record-hint">Hold 1 or multiple keys together (e.g. Alt, Ctrl + Q, Alt + S)</div>
  </div>
  <button id="record-btn">Record Shortcut Keys</button>
  <script src="popup.js"></script>
</body>
</html>
