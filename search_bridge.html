<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Searching Google...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      background: #202124;
      color: #e8eaed;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(66, 133, 244, 0.25);
      border-top-color: #4285f4;
      border-right-color: #00c4b4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .preview {
      max-width: 220px;
      max-height: 160px;
      border-radius: 10px;
      border: 2px solid #4285f4;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <img id="crop-preview" class="preview" alt="Circled Area" />
  <div>Searching circled area on Google Images...</div>
  <script src="search_bridge.js"></script>
</body>
</html>
